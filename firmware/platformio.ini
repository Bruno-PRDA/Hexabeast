; Hexabeast firmware. Two environments:
;   esp32s3 - the robot
;   native  - host build of the pure headers, so the kinematics can be tested
;             without hardware. `pio test -e native`
;
; robot_geometry.h is generated: run `python ../tools/gen_firmware_header.py`
; after any change to robot_config.py, or `--check` to verify it is current.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM        ; the camera needs it; harmless before then
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17

; Host build. src/ is excluded because servo_bus.cpp and main.cpp are Arduino
; code; leg_ik.h and gait.h are deliberately free of it, which is what lets the
; maths be tested on a laptop.
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra -I include
test_framework = unity
